services:
  api:
    build: .
    command: ["sh", "scripts/docker_entrypoint.sh"]
    ports:
      - "8000:8000"
    environment:
      SERVICE_MODE: api
      PORT: "8000"
      CHURN_API_KEY: ${CHURN_API_KEY:-change-me-in-production}
      ENVIRONMENT: production
      LOG_JSON: "true"
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  streamlit:
    build: .
    command: ["sh", "scripts/docker_entrypoint.sh"]
    ports:
      - "8501:8501"
    environment:
      SERVICE_MODE: streamlit
      PORT: "8501"
      CHURN_API_BASE_URL: http://api:8000
      ENVIRONMENT: production
    depends_on:
      api:
        condition: service_healthy
